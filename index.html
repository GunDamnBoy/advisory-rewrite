<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投顧知識庫</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1d212a; --line:#272c37;
  --fg:#e8eaf0; --dim:#98a0b3; --faint:#6b7386;
  --up:#e05252; --dn:#3fa66a; --flat:#8a92a6;   /* 台股慣例：漲紅跌綠 */
  --accent:#5b8def; --warn:#d9a441;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.75 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1080px;margin:0 auto;padding:24px 18px 80px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;
  justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-size:19px;margin:0;letter-spacing:.5px}
h1 small{color:var(--faint);font-weight:400;font-size:13px;margin-left:8px}
select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:6px 10px;font:inherit;font-size:13px}
.headline{font-size:26px;line-height:1.45;font-weight:700;margin:22px 0 6px}
.stamp{color:var(--dim);font-size:13px}
.stamp b{color:var(--fg);font-weight:600}
.banner{background:#2a2013;border:1px solid #4a3a1c;color:#e8cf9a;
  border-radius:8px;padding:10px 14px;margin:14px 0;font-size:13px}
section{margin:34px 0}
h2{font-size:14px;letter-spacing:2px;color:var(--faint);font-weight:600;
  text-transform:uppercase;margin:0 0 14px;border-left:3px solid var(--accent);padding-left:10px}
.grid{display:grid;gap:12px}
.snap{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.snap .cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.snap .k{color:var(--dim);font-size:12px}
.snap .v{font-size:17px;font-weight:700;margin-top:3px}
.snap .c{font-size:12px;margin-top:2px}
.up{color:var(--up)} .dn{color:var(--dn)} .flat{color:var(--flat)}
.focus{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.focus .cell{background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:8px;padding:13px 15px}
.focus .t{font-weight:700;margin-bottom:5px}
.focus .d{color:var(--dim);font-size:13.5px}
ol.take{padding-left:22px;margin:0}
ol.take li{margin-bottom:11px}
.thermo{display:flex;align-items:center;gap:16px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:14px 16px;flex-wrap:wrap}
.gauge{flex:1;min-width:200px;height:9px;background:#0b0d11;border-radius:99px;overflow:hidden}
.gauge i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--dn),var(--warn),var(--up))}
.lvl{font-size:30px;font-weight:800;line-height:1}
.pulse{display:flex;gap:10px;flex-wrap:wrap}
.pulse .p{background:var(--panel);border:1px solid var(--line);border-radius:99px;
  padding:7px 15px;font-size:13px}
.pulse .p b{margin-right:7px}
table.watch{width:100%;border-collapse:collapse}
table.watch td{border-top:1px solid var(--line);padding:11px 8px;vertical-align:top;font-size:14px}
table.watch td.d{white-space:nowrap;color:var(--accent);font-weight:600;width:1%;padding-right:16px}
.verdict{display:inline-block;border-radius:5px;padding:1px 8px;font-size:12px;margin-right:8px}
.v-應驗{background:#12331f;color:#6ee39b} .v-落空{background:#3a1616;color:#ff9b9b}
.v-未決{background:#2b2b33;color:#b9bfcf}
.essay{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px}
.essay h3{margin:0 0 4px;font-size:21px}
.essay .by{color:var(--faint);font-size:12.5px;margin-bottom:14px}
.essay .kick{color:var(--dim);font-style:italic;border-left:2px solid var(--line);
  padding-left:12px;margin-bottom:16px}
.essay p{margin:0 0 14px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 4px}
.sec-h .zh{font-size:22px;font-weight:700}
.sec-h .en{color:var(--faint);font-size:12px;letter-spacing:2px;text-transform:uppercase}
.sec-intro{color:var(--dim);font-size:13.5px;margin-bottom:18px}
.grp{margin:24px 0}
.grp-h{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.grp-h .n{font-weight:700;font-size:15.5px}
.grp-h .c{color:var(--faint);font-size:12px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 17px}
.card.deep{border-color:#39435c;background:var(--panel2)}
.card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  font-size:11.5px;color:var(--faint);margin-bottom:7px}
.tag{background:#232833;border-radius:4px;padding:1px 7px;color:var(--dim)}
.tag.base{background:#1b2f24;color:#7fd6a3}
.tag.deep{background:#242c3d;color:#9fb6e8}
.tag.thread{background:#2f2438;color:#c9a3e0}
.card h4{margin:0 0 8px;font-size:15.5px;line-height:1.5}
.card .body{font-size:14px;color:#d5d9e4}
.card .body p{margin:0 0 9px}
.card ul{margin:10px 0 0;padding-left:19px;font-size:13px;color:var(--dim)}
.card ul li{margin-bottom:5px}
.card .src{margin-top:11px;font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.about{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:13px;color:var(--dim)}
.about h4{color:var(--fg);margin:14px 0 6px;font-size:13.5px}
.about h4:first-child{margin-top:0}
.about ul{margin:0;padding-left:19px}
.about li{margin-bottom:6px}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);
  color:var(--faint);font-size:12px}
#err{background:#3a1616;border:1px solid #5c2626;color:#ffb3b3;
  padding:14px 16px;border-radius:8px;margin:20px 0;display:none;white-space:pre-wrap}
@media(max-width:640px){.headline{font-size:21px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>投顧知識庫 <small>每日閱讀中心</small></h1>
    <select id="picker" aria-label="選擇日期"></select>
  </header>
  <div id="err"></div>
  <main id="app"></main>
  <footer>
    內容為新聞彙整與研究輔助，<b>非投資建議</b>。報價口徑以各卡片標註為準。
    <span id="prov"></span>
  </footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[<>]/g, c => ({"<":"&lt;",">":"&gt;"}[c]));

/* 語意 → 顏色。**這是唯一一處把語意翻成呈現的地方。**
   舊站把 CSS class 直接存進資料（tone 是 t-red／t-orange），改一次版面就要動
   全部歷史檔，而歷史檔是不可改寫的。所以這裡同時吃兩種：新版的語意值，
   以及 2026-08-19 之前那 18 天的舊 class。 */
const TONE = {
  "偏多":"up", "偏空":"dn", "中性":"flat",
  "t-red":"up", "t-orange":"up", "t-yellow":"flat",
  "t-green":"dn", "up":"up", "dn":"dn", "fl":"flat"
};
const toneCls = (t) => TONE[t] || "flat";

/* body 可能是字串（重寫版）或字串陣列（舊站深度卡）。
   照著其中一種寫的渲染邏輯碰到另一種不會報錯，只會安靜整段掉——
   這是接舊站歷史時最先撞到的一個坑。 */
const bodyHtml = (b) =>
  Array.isArray(b) ? b.map(p => `<p>${p}</p>`).join("") : `<p>${b ?? ""}</p>`;

const num = (n, pct) => {
  if (n === null || n === undefined) return "";
  const s = typeof n === "number" ? n.toLocaleString("zh-TW",{maximumFractionDigits:3}) : n;
  if (pct === null || pct === undefined) return s;
  const sign = pct > 0 ? "+" : "";
  return `${s} <span class="${pct>0?"up":pct<0?"dn":"flat"}">${sign}${pct}%</span>`;
};

async function getJSON(u){
  const r = await fetch(u, {cache:"no-store"});
  if (!r.ok) throw new Error(`${u} → HTTP ${r.status}`);
  return r.json();
}

function renderCard(c){
  const tags = [];
  if (c.tag) tags.push(`<span class="tag">${esc(c.tag)}</span>`);
  if (c.deep) tags.push(`<span class="tag deep">深度</span>`);
  if (c.base) tags.push(`<span class="tag base">保底數據</span>`);
  if (c.thread) tags.push(`<span class="tag thread">${esc(c.thread)}</span>`);
  const bl = (c.bullets||[]).map(b => `<li>${b}</li>`).join("");
  return `<article class="card${c.deep?" deep":""}">
    <div class="meta">
      <span class="dot ${toneCls(c.tone)}" style="background:currentColor"></span>
      ${tags.join("")}
      <span>${esc(c.src||"")}</span><span>${esc(c.date||"")}</span>
    </div>
    <h4>${c.title||""}</h4>
    <div class="body">${bodyHtml(c.body)}</div>
    ${bl?`<ul>${bl}</ul>`:""}
    ${c.url?`<div class="src"><a href="${esc(c.url)}" target="_blank" rel="noopener">閱讀原文 ↗</a></div>`:""}
  </article>`;
}

function render(d, entry){
  const ov = d.overview || {};
  const H = [];

  if (entry && entry.archived) H.push(
    `<div class="banner">這一天來自舊站 <b>${esc(entry.archived)}</b> 的存檔，
     schema 與 2026-08-19 起的重寫版不同（例如 thermo 是數字、tone 存的是樣式代碼）。
     內容原樣保留、未經正規化。</div>`);

  H.push(`<div class="headline">${d.headline||""}</div>
    <div class="stamp">${esc(d.stamp||"")} ｜ 全站 <b>${d.cards??"—"}</b> 則
    ${d.window?`｜ 窗口 ${esc(d.window.from)} → ${esc(d.window.to)}`:""}</div>`);

  if (ov.snap?.length) H.push(`<section><h2>快照</h2><div class="grid snap">` +
    ov.snap.map(s => `<div class="cell"><div class="k">${s.k||""}</div>
      <div class="v">${s.v ? s.v : num(s.num, s.chgPct)}</div>
    </div>`).join("") + `</div></section>`);
    // 註：v 存在時就只渲染 v——新舊兩版的 v 字串裡都已經含漲跌幅，
    // 再補一行 chgPct 會變成同一個數字印兩次。

  if (ov.focus?.length) H.push(`<section><h2>今日焦點</h2><div class="grid focus">` +
    ov.focus.map(f => `<div class="cell"><div class="t">${f.t||f.k||""}</div>
      <div class="d">${f.d||f.v||""}</div></div>`).join("") + `</div></section>`);

  if (ov.takeaways?.length) H.push(`<section><h2>${esc(ov.takeawaysTitle||"重點")}</h2>
    <ol class="take">${ov.takeaways.map(t=>`<li>${t}</li>`).join("")}</ol></section>`);

  if (ov.thermo){
    const lv = parseInt(ov.thermo.level ?? ov.thermo, 10);
    H.push(`<section><h2>風險溫度</h2><div class="thermo">
      <div class="lvl">${isNaN(lv)?"—":lv}</div>
      <div class="gauge"><i style="width:${isNaN(lv)?0:lv}%"></i></div>
      <div style="flex-basis:100%;color:var(--dim);font-size:13px">${ov.thermo.note||""}</div>
    </div></section>`);
  }

  if (ov.pulse?.length) H.push(`<section><h2>脈動</h2><div class="pulse">` +
    ov.pulse.map(p=>`<span class="p"><b>${esc(p.k)}</b>
      <span class="${toneCls(p.dir)}">${esc(p.dir)}</span>
      ${p.note?`<span style="color:var(--faint)"> ・${esc(p.note)}</span>`:""}</span>`).join("") +
    `</div></section>`);

  if (ov.watchReview?.length) H.push(`<section><h2>前期盯盤回顧</h2><table class="watch">` +
    ov.watchReview.map(w=>`<tr><td class="d">${esc(w.d||"")}</td><td>
      <span class="verdict v-${esc(w.verdict||"未決")}">${esc(w.verdict||"未決")}</span>
      ${w.t||""}${w.note?`<div style="color:var(--dim);margin-top:6px">${w.note}</div>`:""}
    </td></tr>`).join("") + `</table></section>`);

  if (ov.watch?.length) H.push(`<section><h2>接下來要盯什麼</h2><table class="watch">` +
    ov.watch.map(w=>`<tr><td class="d">${esc(w.d||"")}</td><td>${w.t||""}</td></tr>`).join("") +
    `</table></section>`);

  if (d.essay) H.push(`<section><h2>今日心得</h2><div class="essay">
    <h3>${d.essay.title||""}</h3><div class="by">${esc(d.essay.by||"")}</div>
    ${d.essay.kick?`<div class="kick">${d.essay.kick}</div>`:""}
    ${(d.essay.paras||[]).map(p=>`<p>${p}</p>`).join("")}</div></section>`);

  (d.sections||[]).forEach(s=>{
    H.push(`<section><div class="sec-h"><span class="zh">${esc(s.title||"")}</span>
      <span class="en">${esc(s.en||"")}</span></div>
      ${s.intro?`<div class="sec-intro">${s.intro}</div>`:""}` +
      (s.groups||[]).map(g=>`<div class="grp"><div class="grp-h">
        <span class="n">${esc(g.label||"")}</span>
        <span class="c">${(g.cards||[]).length} 則</span></div>
        <div class="cards">${(g.cards||[]).map(renderCard).join("")}</div></div>`).join("") +
      `</section>`);
  });

  const ab = d.about;
  if (ab){
    const list = (t,a)=> a?.length ? `<h4>${t}</h4><ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>` : "";
    H.push(`<section><h2>關於這一版</h2><div class="about">
      ${ab.timeliness?`<h4>時效</h4><div>${ab.timeliness}</div>`:""}
      ${list("編輯說明", ab.notes)}${list("執行紀錄", ab.run)}${list("已知限制", ab.limits)}
    </div></section>`);
  }

  $("#app").innerHTML = H.join("");
}

async function main(){
  try{
    const idx = await getJSON("data/index.json");
    const days = idx.days || [];
    if (!days.length) throw new Error("index.json 沒有任何 days");

    $("#picker").innerHTML = days.map(d =>
      `<option value="${d.date}">${d.date}${d.weekday?" "+d.weekday:""}${d.archived?" · 存檔":""}</option>`
    ).join("");
    $("#prov").textContent = `｜ 共 ${idx.count ?? days.length} 天，索引更新於 ${idx.updated || "—"}`;

    async function show(date){
      const e = days.find(x => x.date === date) || days[0];
      $("#picker").value = e.date;
      history.replaceState(null, "", "#" + e.date);
      // file 可能是相對路徑（本 repo）或絕對網址（接進來的舊站存檔）
      render(await getJSON(e.file), e);
      scrollTo(0, 0);
    }
    $("#picker").onchange = (ev) => show(ev.target.value);
    addEventListener("hashchange", () => show(location.hash.slice(1)));
    await show(location.hash.slice(1) || days[0].date);
  } catch(e){
    $("#err").style.display = "block";
    $("#err").textContent = "載入失敗：" + e.message +
      "\n\n若這是剛開好的 Pages，資料可能還沒部署完；重新整理再試一次。";
  }
}
main();
</script>
</body>
</html>
