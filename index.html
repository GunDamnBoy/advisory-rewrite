<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投顧知識庫儀表板</title>
<style>
/* 台新新光金控企業識別（手冊 A-5-1）。標準色：台新紅 Pantone 186 #D70C18、
   Dark Gray Cool Gray 11 #464646、Taishin Gray Cool Gray 2 #D8D8D8。
   輔助色：Light Red Pantone 2339 #E38383、Medium Gray Cool Gray 8 #656565。

   **品牌紅只當結構色，不進漲跌。** 台新紅 #D70C18 與偏空紅 #dc2626 對比僅 1.10:1，
   並排是同一個紅；兩者靠位置區隔——品牌紅只出現在結構元件（頁首色帶、tab、
   卡片左邊條、連結、標記），漲跌紅只出現在數字與 tone。**不要把 --brand 用在數值上。**

   --brand-bg 與 --brand-line 是 #D70C18 的淡化衍生色，手冊沒有這兩個值，
   標在這裡是因為 chip 需要一個能放紅字的底。#D8D8D8（1.43:1）與 #E38383（2.68:1）
   對白底都不到 AA，**只能當底色與邊框，不能拿來寫字**。 */
:root{
  --bg:#f2f2f2; --panel:#fff; --line:#d8d8d8; --line2:#e8e8e8;
  --fg:#222; --dim:#656565; --faint:#727272;
  --brand:#d70c18; --brand-bg:#fdf1f2; --brand-line:#f0c7ca;
  --up:#16a34a; --dn:#dc2626; --flat:#64748b; --amber:#d97706;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.75 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
.bar{background:var(--panel);border-bottom:1px solid var(--line);border-top:3px solid var(--brand)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ── 頁首 ───────────────────────────── */
.top{display:flex;justify-content:space-between;align-items:flex-start;
  gap:16px;flex-wrap:wrap;padding:18px 0 14px}
.brand{display:flex;gap:9px;align-items:baseline}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand);
  display:inline-block;transform:translateY(-3px);flex:none}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.3px}
.sub{color:var(--faint);font-size:12.5px;margin-top:2px}
.updated{border:1px solid var(--line);border-radius:999px;padding:7px 15px;
  font-size:12.5px;color:var(--dim);background:#fafafa}
.updated b{color:var(--fg)}

/* ── 日期列 ─────────────────────────── */
.dates{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:12px 0;border-top:1px solid var(--line2)}
.dates .lbl{color:var(--faint);font-size:12.5px;margin-right:2px}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:6px 14px;font-size:13px;cursor:pointer;color:var(--fg);
  display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.pill:hover{border-color:#bdbdbd}
.pill.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.pill .th{font-size:11px;color:var(--faint)}
.pill.on .th{color:#fdeef0}
select,input{border:1px solid var(--line);border-radius:8px;padding:7px 11px;
  font:inherit;font-size:13px;background:var(--panel);color:var(--fg)}
input{min-width:190px}
.meta-r{width:100%;text-align:right;color:var(--faint);font-size:12px;margin-top:-4px}

/* ── 分頁 ───────────────────────────── */
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;
  padding:13px 14px;font:inherit;font-size:14.5px;color:var(--dim);cursor:pointer;
  white-space:nowrap}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}

/* ── 內容 ───────────────────────────── */
main{padding:26px 0 90px}
.banner{background:#fff8e6;border:1px solid #f0dfae;color:#7a5b12;
  border-radius:10px;padding:11px 15px;margin-bottom:20px;font-size:13px}
.headline{font-size:25px;line-height:1.5;font-weight:800;margin:0 0 8px}
.stamp{color:var(--dim);font-size:13px;margin-bottom:22px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow)}
.pad{padding:20px 22px}
.sec-h{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin-bottom:8px}
.sec-h .zh{font-size:26px;font-weight:800}
.sec-h .en{color:var(--faint);font-size:12px;letter-spacing:1.6px;text-transform:uppercase}
.sec-h .n{margin-left:auto;color:var(--faint);font-size:13px}
.sec-intro{color:var(--dim);font-size:13.5px;margin-bottom:26px;max-width:1000px}

h2.blk{font-size:13px;letter-spacing:1.6px;color:var(--faint);font-weight:700;
  text-transform:uppercase;margin:0 0 13px}
section.blk{margin-bottom:26px}

/* 快照 */
.snap{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.snap .c{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:13px 15px;text-align:center;box-shadow:var(--shadow)}
.snap .k{color:var(--dim);font-size:12.5px}
.snap .v{font-size:19px;font-weight:800;margin-top:5px;letter-spacing:-.2px}
.up{color:var(--up)} .dn{color:var(--dn)} .flat{color:var(--flat)} .amber{color:var(--amber)}

/* 焦點 */
.focus{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.focus .c{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--brand);
  border-radius:11px;padding:14px 17px;box-shadow:var(--shadow)}
.focus .t{font-weight:700;margin-bottom:5px}
.focus .d{color:var(--dim);font-size:13.5px}

ol.take{margin:0;padding-left:24px}
ol.take li{margin-bottom:11px}
ol.take li::marker{color:var(--brand);font-weight:700}

.thermo{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.thermo .lvl{font-size:40px;font-weight:800;line-height:1;letter-spacing:-1px}
.gauge{flex:1;min-width:210px;height:9px;background:#e4e4e4;border-radius:999px;overflow:hidden}
.gauge i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,#16a34a,#eab308,#dc2626)}
.thermo .note{flex-basis:100%;color:var(--dim);font-size:13.5px}

.pulse{display:flex;gap:10px;flex-wrap:wrap}
.pulse .p{background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;font-size:13px;box-shadow:var(--shadow)}
.pulse .p b{margin-right:8px}

table.w{width:100%;border-collapse:collapse}
table.w td{border-top:1px solid var(--line2);padding:13px 6px;vertical-align:top;font-size:14px}
table.w tr:first-child td{border-top:0}
td.d{white-space:nowrap;color:var(--brand);font-weight:700;width:1%;padding-right:18px}
.rv{color:var(--dim);margin-top:8px;line-height:1.75}
.vd{display:inline-block;border-radius:5px;padding:1px 9px;font-size:12px;
  margin-right:8px;font-weight:600}
.vd.應驗{background:#e7f7ed;color:#15803d}
.vd.落空{background:#fdeaea;color:#b91c1c}
.vd.未決{background:#efefef;color:#656565}

/* 心得 */
.essay h3{margin:0 0 4px;font-size:23px;font-weight:800}
.essay .by{color:var(--faint);font-size:12.5px;margin-bottom:16px}
.essay .kick{color:var(--dim);font-style:italic;border-left:3px solid var(--line);
  padding-left:14px;margin-bottom:18px}
.essay p{margin:0 0 15px}

/* 分組與卡片 */
.grp{margin-bottom:30px}
.grp-h{display:flex;align-items:center;gap:10px;margin-bottom:13px;
  border-left:3px solid var(--brand);padding-left:10px}
.grp-h .n{font-weight:800;font-size:16px}
.grp-h .b{background:#efefef;color:var(--dim);border-radius:6px;
  padding:1px 9px;font-size:12px;font-weight:600}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
article{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:17px 19px;box-shadow:var(--shadow);border-left:3px solid transparent}
article.deep{border-left-color:var(--brand);grid-column:1/-1}
article.base{border-left-color:var(--up)}
.chips{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.chip{border-radius:6px;padding:2px 9px;font-size:11.5px;font-weight:600;
  border:1px solid var(--line);color:var(--dim);background:#fafafa}
.chip.src{color:var(--brand);border-color:var(--brand-line);background:var(--brand-bg)}
.chip.deep{color:#7c3aed;border-color:#ddd0fb;background:#f6f2ff}
.chip.base{color:#15803d;border-color:#bfe6cd;background:#effaf3}
.chip.thread{color:#b45309;border-color:#f0dfae;background:#fff8e6}
.chips .when{margin-left:auto;color:var(--faint);font-size:12px}
article h4{margin:0 0 9px;font-size:16.5px;line-height:1.55;font-weight:700}
.body{font-size:14px;color:#333}
.body p{margin:0 0 10px}
article ul{margin:12px 0 0;padding-left:20px;font-size:13px;color:var(--dim)}
article ul li{margin-bottom:6px}
article ul li::marker{color:var(--brand)}
.srcline{margin-top:13px;padding-top:11px;border-top:1px solid var(--line2);
  text-align:right;font-size:12.5px}

.about h4{margin:20px 0 8px;font-size:14.5px;font-weight:700}
.about h4:first-child{margin-top:0}
.about ul{margin:0;padding-left:20px;color:var(--dim);font-size:13.5px}
.about li{margin-bottom:7px}
.about .t{color:var(--dim);font-size:13.5px}

footer{color:var(--faint);font-size:12px;padding:20px 0 40px;border-top:1px solid var(--line)}
#err{background:#fdeaea;border:1px solid #f3c2c2;color:#991b1b;padding:15px 17px;
  border-radius:10px;white-space:pre-wrap;display:none;margin-top:20px}
.empty{color:var(--faint);font-size:14px;padding:30px 0}
@media(max-width:700px){
  .headline{font-size:20px}.cards{grid-template-columns:1fr}
  .sec-h .zh{font-size:21px}.pad{padding:16px}
}
</style>
</head>
<body>

<div class="bar">
  <div class="wrap">
    <div class="top">
      <div>
        <div class="brand"><span class="dot"></span><h1>投顧知識庫儀表板</h1></div>
        <div class="sub" id="sub"></div>
      </div>
      <div class="updated" id="updated"></div>
    </div>
    <div class="dates" id="dates"></div>
    <div class="meta-r" id="metaR"></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</div>

<main><div class="wrap">
  <div id="err"></div>
  <div id="view"></div>
</div></main>

<footer><div class="wrap">
  內容為新聞彙整與研究輔助，<b>非投資建議</b>。報價口徑以各卡片標註為準。
</div></footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[<>]/g, c => ({"<":"&lt;",">":"&gt;"}[c]));

/* 語意 → 顏色。**這是唯一一處把語意翻成呈現的地方。**
   資料層存語意值（偏多／中性／偏空），顏色由外殼決定，改版只動 CSS。
   同時吃 2026-08-19 之前那 18 天存檔的舊寫法（tone 直接存 CSS class）。 */
const TONE = {"偏多":"up","偏空":"dn","中性":"flat",
  "t-red":"dn","t-orange":"amber","t-yellow":"amber","t-green":"up",
  "up":"up","dn":"dn","fl":"flat"};
const tone = t => TONE[t] || "flat";

/* body 可能是字串（重寫版）或字串陣列（舊站深度卡）。照著其中一種寫的渲染邏輯
   碰到另一種不會報錯，只會安靜整段掉——接舊站歷史時最先撞到的坑。 */
const bodyHtml = b => Array.isArray(b) ? b.map(p=>`<p>${p}</p>`).join("") : `<p>${b ?? ""}</p>`;

const fmt = n => typeof n === "number"
  ? n.toLocaleString("zh-TW",{maximumFractionDigits:3}) : String(n ?? "");
const pct = p => p == null ? "" :
  `<span class="${p>0?"up":p<0?"dn":"flat"}"> ${p>0?"+":""}${p}%</span>`;

async function getJSON(u){
  const r = await fetch(u,{cache:"no-store"});
  if(!r.ok) throw new Error(`${u} → HTTP ${r.status}`);
  return r.json();
}

let DAYS=[], IDX=null, DOC=null, ENTRY=null, TAB=null, Q="";

/* ── 卡片 ───────────────────────────── */
function cardHtml(c){
  const chips=[`<span class="chip src">${esc(c.src||"")}</span>`];
  if(c.tag) chips.push(`<span class="chip">${esc(c.tag)}</span>`);
  if(c.deep) chips.push(`<span class="chip deep">深度</span>`);
  if(c.base) chips.push(`<span class="chip base">保底數據</span>`);
  if(c.thread) chips.push(`<span class="chip thread">${esc(c.thread)}</span>`);
  const bl=(c.bullets||[]).map(b=>`<li>${b}</li>`).join("");
  return `<article class="${c.deep?"deep":""}${c.base?" base":""}">
    <div class="chips">${chips.join("")}<span class="when">${esc(c.date||"")}</span></div>
    <h4>${c.title||""}</h4>
    <div class="body">${bodyHtml(c.body)}</div>
    ${bl?`<ul>${bl}</ul>`:""}
    ${c.url?`<div class="srcline"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.src||"原文")} ↗</a></div>`:""}
  </article>`;
}

const hit = c => !Q || JSON.stringify(c).toLowerCase().includes(Q);

/* ── 各分頁 ─────────────────────────── */
function tabOverview(d){
  const ov=d.overview||{}, H=[];
  if(ov.snap?.length) H.push(`<section class="blk"><h2 class="blk">快照</h2><div class="snap">`+
    ov.snap.map(s=>`<div class="c"><div class="k">${s.k||""}</div>
      <div class="v">${s.num!=null?fmt(s.num)+pct(s.chgPct):(s.v||"")}</div></div>`).join("")+
    `</div></section>`);

  if(ov.focus?.length) H.push(`<section class="blk"><h2 class="blk">今日焦點</h2><div class="focus">`+
    ov.focus.map(f=>`<div class="c"><div class="t">${f.t||f.k||""}</div>
      <div class="d">${f.d||f.v||""}</div></div>`).join("")+`</div></section>`);

  if(ov.takeaways?.length) H.push(`<section class="blk">
    <h2 class="blk">${esc(ov.takeawaysTitle||"重點")}</h2>
    <div class="card pad"><ol class="take">${ov.takeaways.map(t=>`<li>${t}</li>`).join("")}</ol></div></section>`);

  if(ov.thermo){
    const lv=parseInt(ov.thermo.level ?? ov.thermo,10);
    H.push(`<section class="blk"><h2 class="blk">風險溫度</h2><div class="card pad thermo">
      <div class="lvl">${isNaN(lv)?"—":lv}</div>
      <div class="gauge"><i style="width:${isNaN(lv)?0:lv}%"></i></div>
      <div class="note">${ov.thermo.note||""}</div></div></section>`);
  }

  if(ov.pulse?.length) H.push(`<section class="blk"><h2 class="blk">脈動</h2><div class="pulse">`+
    ov.pulse.map(p=>`<span class="p"><b>${esc(p.k)}</b><span class="${tone(p.dir)}">${esc(p.dir)}</span>`+
      (p.note?`<span style="color:var(--faint)"> ・${esc(p.note)}</span>`:"")+`</span>`).join("")+
    `</div></section>`);

  if(ov.watchReview?.length) H.push(`<section class="blk"><h2 class="blk">前期盯盤回顧</h2>
    <div class="card pad"><table class="w">`+ov.watchReview.map(w=>{
      // 前期盯盤回顧是**兩層**：上層是當初丟出去的那句盯盤，下層是這一輪的回顧。
      // 欄位名有兩種方言 —— 2026-08-19 重寫時改了名字也對調了語意：
      //   重寫前（站上十九天）：t＝原文、note＝回顧
      //   重寫後：              w＝原文、t＝回顧
      // 渲染器當時沒跟著改，於是 8/19、8/20 兩版把「回顧」畫在原文的位置，
      // 而原文（w）沒有任何地方讀它 —— 讀者看不到當初預測了什麼，且兩邊都不會報錯。
      // **歷史封存不回頭改**，所以方言判讀住在這裡，判準是「有沒有 w」。
      const neo = w.w != null;
      const orig = (neo ? w.w : w.t) || "";
      const review = (neo ? w.t : w.note) || "";
      return `<tr><td class="d">${esc(w.d||"")}</td><td>
      <span class="vd ${esc(w.verdict||"未決")}">${esc(w.verdict||"未決")}</span>${orig}
      ${review?`<div class="rv">${review}</div>`:""}</td></tr>`;
    }).join("")+
    `</table></div></section>`);

  if(ov.watch?.length) H.push(`<section class="blk"><h2 class="blk">接下來要盯什麼</h2>
    <div class="card pad"><table class="w">`+ov.watch.map(w=>
      `<tr><td class="d">${esc(w.d||"")}</td><td>${w.t||""}</td></tr>`).join("")+
    `</table></div></section>`);

  return H.join("") || `<div class="empty">這一天沒有三分鐘總覽。</div>`;
}

function tabEssay(d){
  const e=d.essay;
  if(!e) return `<div class="empty">這一天沒有摘要與心得。</div>`;
  return `<div class="card pad essay">
    <h3>${e.title||""}</h3><div class="by">${esc(e.by||"")}</div>
    ${e.kick?`<div class="kick">${e.kick}</div>`:""}
    ${(e.paras||[]).map(p=>`<p>${p}</p>`).join("")}</div>`;
}

function tabSection(d,id){
  const s=(d.sections||[]).find(x=>x.id===id);
  if(!s) return `<div class="empty">這一天沒有這個區塊。</div>`;
  const groups=(s.groups||[]).map(g=>{
    const cs=(g.cards||[]).filter(hit);
    if(!cs.length) return "";
    return `<div class="grp"><div class="grp-h">
      <span class="n">${esc(g.label||"")}</span><span class="b">${cs.length}</span></div>
      <div class="cards">${cs.map(cardHtml).join("")}</div></div>`;
  }).join("");
  const total=(s.groups||[]).reduce((n,g)=>n+(g.cards||[]).length,0);
  return `<div class="sec-h"><span class="zh">${esc(s.title||"")}</span>
      <span class="en">${esc(s.en||"")}</span><span class="n">${total} 則</span></div>
    ${s.intro?`<div class="sec-intro">${s.intro}</div>`:""}
    ${groups || `<div class="empty">沒有符合「${esc(Q)}」的卡片。</div>`}`;
}

function tabAbout(d){
  const a=d.about;
  if(!a) return `<div class="empty">這一天沒有紀錄。</div>`;
  const L=(t,arr)=>arr?.length?`<h4>${t}</h4><ul>${arr.map(x=>`<li>${x}</li>`).join("")}</ul>`:"";
  return `<div class="card pad about">
    ${a.timeliness?`<h4>時效</h4><div class="t">${a.timeliness}</div>`:""}
    ${L("編輯說明",a.notes)}${L("執行紀錄",a.run)}${L("已知限制",a.limits)}</div>`;
}

/* ── 組裝 ───────────────────────────── */
function tabsFor(d){
  const t=[{id:"overview",name:"三分鐘總覽"},{id:"essay",name:"摘要與心得"}];
  (d.sections||[]).forEach(s=>t.push({id:s.id,name:s.title||s.id}));
  t.push({id:"about",name:"關於與方法"});
  return t;
}

function paint(){
  const d=DOC, list=tabsFor(d);
  if(!list.some(t=>t.id===TAB)) TAB=list[0].id;

  $("#tabs").innerHTML=list.map(t=>
    `<button class="${t.id===TAB?"on":""}" data-t="${t.id}">${esc(t.name)}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    TAB=b.dataset.t; setHash(); paint(); scrollTo(0,0);
  });

  let body;
  if(TAB==="overview") body=tabOverview(d);
  else if(TAB==="essay") body=tabEssay(d);
  else if(TAB==="about") body=tabAbout(d);
  else body=tabSection(d,TAB);

  const arch=ENTRY?.archived
    ? `<div class="banner">這一天來自舊站 <b>${esc(ENTRY.archived)}</b> 的存檔，
       schema 與 2026-08-19 起的重寫版不同（thermo 是數字、tone 存的是樣式代碼）。
       內容原樣保留、未經正規化。</div>` : "";

  const head = TAB==="overview"
    ? `<div class="headline">${d.headline||""}</div>
       <div class="stamp">${esc(d.stamp||"")} ｜ 全站 <b>${d.cards??"—"}</b> 則</div>` : "";

  $("#view").innerHTML = arch + head + body;
}

function setHash(){ history.replaceState(null,"",`#${DOC.date}/${TAB}`); }

function paintDates(){
  const recent=DAYS.slice(0,7), older=DAYS.slice(7);
  const pills=recent.map(e=>{
    const md=e.date.slice(5).replace("-","/");
    const th=e.thermo!=null?`<span class="th">${e.thermo}</span>`:"";
    return `<button class="pill ${e.date===DOC?.date?"on":""}" data-d="${e.date}">
      ${md} ${esc(e.weekday||"")}${th}</button>`;
  }).join("");
  const sel=older.length?`<select id="older"><option value="">更早（${older.length} 天）…</option>`+
    older.map(e=>`<option value="${e.date}" ${e.date===DOC?.date?"selected":""}>${e.date} ${esc(e.weekday||"")}</option>`).join("")+
    `</select>`:"";
  $("#dates").innerHTML=`<span class="lbl">日期</span>${pills}${sel}
    <input id="q" type="search" placeholder="篩選本日卡片…" value="${esc(Q)}">`;
  $("#dates").querySelectorAll(".pill").forEach(b=>b.onclick=()=>show(b.dataset.d));
  const o=$("#older"); if(o) o.onchange=e=>e.target.value&&show(e.target.value);
  const q=$("#q"); q.oninput=e=>{ Q=e.target.value.trim().toLowerCase(); paint(); };
}

async function show(date){
  ENTRY=DAYS.find(x=>x.date===date)||DAYS[0];
  DOC=await getJSON(ENTRY.file);   // 相對路徑（本 repo）或絕對網址（舊站存檔）
  $("#updated").innerHTML=`最後更新 <b>${esc(ENTRY.stamp||DOC.stamp||"")}</b>`;
  $("#sub").textContent=`${IDX.count??DAYS.length} 天封存 · 更新 ${ENTRY.date.slice(5).replace("-","/")}`;
  $("#metaR").textContent=`共 ${IDX.count??DAYS.length} 天封存 · 全部保留`;
  // paint() 必須排在 setHash() 前面：TAB 的正規化（不存在的分頁 → 第一個分頁）
  // 只發生在 paint() 裡，而網址只給日期時 TAB 還是初始的 null。反過來寫會把
  // #2026-08-15 改寫成 #2026-08-15/null —— 頁面仍然正常，所以這種錯不會自己現形。
  paintDates(); paint(); setHash();
}

async function main(){
  try{
    IDX=await getJSON("data/index.json");
    DAYS=IDX.days||[];
    if(!DAYS.length) throw new Error("index.json 沒有任何 days");
    const [h1,h2]=location.hash.slice(1).split("/");
    if(h2) TAB=h2;
    addEventListener("hashchange",()=>{
      const [a,b]=location.hash.slice(1).split("/");
      if(b&&b!==TAB){TAB=b;paint();}
      if(a&&a!==DOC?.date) show(a);
    });
    await show(DAYS.some(x=>x.date===h1)?h1:DAYS[0].date);
  }catch(e){
    $("#err").style.display="block";
    $("#err").textContent="載入失敗："+e.message+
      "\n\n若這是剛部署的版本，資料可能還在同步；重新整理再試一次。";
  }
}
main();
</script>
</body>
</html>
